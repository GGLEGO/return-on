<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 답례 : ON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 헤더 ===== -->
  <header class="header">
    <a href="../index.html" class="logo" aria-label="답례 ON 홈">
      <svg class="logo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="8" width="18" height="4" rx="1"/>
        <path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/>
        <path d="M12 8v13"/>
        <path d="M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5h4zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5h-4z"/>
      </svg>
      <span class="logo__text">답례 : <em>ON</em></span>
    </a>
    <a href="../index.html" class="header__home">홈으로 <span aria-hidden="true">›</span></a>
  </header>

  <main class="login">
    <div class="login__intro">
      <h1>마음을 전하는 순간,<br><strong>답례 : ON</strong></h1>
      <p>어떤 회원으로 로그인하시겠어요?</p>
    </div>

    <div class="login__cards">

      <!-- ===== 판매자 로그인 ===== -->
      <section class="card card--seller" aria-labelledby="seller-title">
        <span class="card__icon" aria-hidden="true">🏪</span>
        <h2 id="seller-title">판매자로 로그인하기</h2>
        <p class="card__desc">상품과 주문, 고객을 한곳에서 관리하세요.</p>

        <form class="form" action="../../seller/dashboard/index.html">
          <label class="field">
            <span>아이디</span>
            <input type="text" placeholder="판매자 아이디" autocomplete="username" required>
          </label>
          <label class="field">
            <span>비밀번호</span>
            <input type="password" placeholder="비밀번호" autocomplete="current-password" required>
          </label>
          <div class="form__row">
            <label class="check"><input type="checkbox"><span></span>로그인 상태 유지</label>
            <a href="#">아이디·비밀번호 찾기</a>
          </div>
          <button type="submit" class="btn btn--seller">판매자로 로그인하기</button>
        </form>

        <p class="card__join">아직 입점 전이신가요? <a href="#">판매자 입점 신청</a></p>
      </section>

      <!-- ===== 구매자 로그인 ===== -->
      <section class="card card--buyer" aria-labelledby="buyer-title">
        <span class="card__icon" aria-hidden="true">🎁</span>
        <h2 id="buyer-title">구매자로 로그인하기</h2>
        <p class="card__desc">소중한 마음에 어울리는 답례품을 찾아보세요.</p>

        <form class="form" action="../index.html">
          <label class="field">
            <span>아이디</span>
            <input type="text" placeholder="구매자 아이디" autocomplete="username" required>
          </label>
          <label class="field">
            <span>비밀번호</span>
            <input type="password" placeholder="비밀번호" autocomplete="current-password" required>
          </label>
          <div class="form__row">
            <label class="check"><input type="checkbox"><span></span>로그인 상태 유지</label>
            <a href="#">아이디·비밀번호 찾기</a>
          </div>
          <button type="submit" class="btn btn--buyer">구매자로 로그인하기</button>
        </form>

        <p class="card__join">아직 회원이 아니신가요? <a href="#">회원가입</a></p>
      </section>

    </div>
  </main>

  <footer class="footer">© 답례 : ON</footer>

</body>
</html>
